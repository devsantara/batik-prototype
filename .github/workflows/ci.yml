name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-vp installs Vite+, Node and pnpm, and caches package-manager data.
      # The version is pinned deliberately: the docs call out that the `v1` tag
      # no longer receives updates.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: '24'
          cache: true

      # --frozen-lockfile fails the build if the lockfile is out of step with
      # package.json, rather than silently resolving something new. It also
      # re-runs the supply-chain policies in pnpm-workspace.yaml.
      - run: vp install --frozen-lockfile

      # Format, lint and type check in one pass.
      - run: vp check

      - run: vp test run

      # Builds every package, which is also what runs publint, attw and the
      # unused-dependency gate - so a package that would publish broken fails
      # here rather than at release time.
      - run: vp run -r build

      # A release can only land if every changed package carries a changeset.
      # Skipped on the release PR itself, which consumes them.
      - name: Check for missing changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
