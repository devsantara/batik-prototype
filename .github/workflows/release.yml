name: Release

on:
  push:
    branches:
      - main

permissions: {} # each job declares only the permissions it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: false # avoid cache poisoning in release jobs
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to push the version commit (changesets/action/version)
      pull-requests: write # to create or update the version PR (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: false # avoid cache poisoning in release jobs
      - name: Create or update version PR
        uses: changesets/action/version@v2.1.2
        with:
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'

  pack:
    name: Pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: false # avoid cache poisoning in release jobs
      - name: Build packages
        run: vp run build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    # Must match the environment configured for the npm trusted publisher.
    # Add required reviewers to it in the repo settings to gate each release.
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write # to push git tags and create GitHub releases (changesets/action/publish)
      id-token: write # to publish to npm with trusted publishing (OIDC)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: false # avoid cache poisoning in release jobs
      - name: Publish packages
        uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          push-git-tags: true
          create-github-releases: true
